<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>CogniTerm</title>
  <desc>Charcoal plate with a rising mint data curve and sample nodes.</desc>
  <defs>
    <linearGradient id="plate" x1="512" y1="0" x2="512" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3A4055"/>
      <stop offset="0.5" stop-color="#1B1F2A"/>
      <stop offset="1" stop-color="#0A0C12"/>
    </linearGradient>
    <linearGradient id="toplight" x1="512" y1="0" x2="512" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mint" x1="512" y1="340" x2="512" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#74FFDE"/>
      <stop offset="1" stop-color="#17C79C"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#plate)"/>
  <rect width="1024" height="1024" fill="url(#toplight)"/>
  <rect x="262" y="428" width="520" height="4" fill="#FFFFFF" fill-opacity="0.09"/>
  <rect x="262" y="536" width="520" height="4" fill="#FFFFFF" fill-opacity="0.09"/>
  <rect x="262" y="644" width="520" height="4" fill="#FFFFFF" fill-opacity="0.09"/>
  <rect x="262" y="752" width="520" height="4" fill="#FFFFFF" fill-opacity="0.09"/>
  <rect x="262" y="760" width="520" height="6" fill="#FFFFFF" fill-opacity="0.20"/>
  <path d="M 262 724 C 372 724 400 560 520 540 C 640 520 690 400 776 352" fill="none" stroke="url(#mint)" stroke-width="70" stroke-linecap="round"/>
  <circle cx="370" cy="660" r="26" fill="#FFFFFF"/>
  <circle cx="607" cy="503" r="26" fill="#FFFFFF"/>
  <circle cx="688" cy="428" r="26" fill="#FFFFFF"/>
  <circle cx="776" cy="352" r="56" fill="#FFFFFF"/>
</svg>
